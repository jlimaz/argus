adsb = 0.05
gnss_jammer = 0.2

# 2400-2483.5 MHz: the chart marks it as a "Key Wi-Fi Band" (hatched). Bluetooth and drone links are not on the chart.
[[band]]
name = "ism_2400"
lo_hz = 2400e6
hi_hz = 2483.5e6
source = "https://www.ntia.gov/sites/default/files/2025-09/ntia-us-frequency-allocations.pdf"
note = "Chart marks 2400-2483.5 MHz as a Key Wi-Fi Band. Bluetooth and drone_link at 1.0 are unsourced judgement."
[band.weights]
adsb = 0.05
lora = 0.2
gnss_jammer = 0.2
pulsed_radar = 0.2

[[band]]
name = "cbrs_3500"
lo_hz = 3550e6
hi_hz = 3700e6
source = "unsourced"
note = "CBRS shares this band with radar (the PLAN's red scenario). Edges from mcls.contracts.BANDS."
[band.weights]
bluetooth = 0.05
lora = 0.05
adsb = 0.05
gnss_jammer = 0.2

# 5 GHz: the chart hatches several Key Wi-Fi Bands between about 5.15 and 5.9 GHz; exact edges not readable in the copy opened.
[[band]]
name = "unii_5ghz"
