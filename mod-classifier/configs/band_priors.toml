hi_hz = 5925e6
source = "https://www.ntia.gov/sites/default/files/2025-09/ntia-us-frequency-allocations.pdf"
note = "Chart marks Key Wi-Fi Bands in 5 GHz; edges from mcls.contracts.BANDS (unii_5ghz). 5.8 GHz drone video links (PLAN 5.7) keep drone_link at 1.0, unsourced."
[band.weights]
