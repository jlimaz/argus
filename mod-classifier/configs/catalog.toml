# Every file of every dataset in PLAN.md section 3.1: URL, size, checksum, access.
# Built 2026-11-12 from each source's own API (the `api` URL per dataset). Sizes and checksums are
# copied from those responses, never typed by hand; to refresh, re-read the `api` URL.
# An entry with files = [] says why its list is unknown and what would resolve it.
#
# access: direct     plain HTTPS GET, byte ranges honoured (mcls.acquire fetches it)
#         fairdata   per-file single-use token from Etsin, one stream, no ranges (mcls.acquire fetches it)
#         ieee_login IEEE DataPort, files only after login (mcls.acquire refuses)
#         manual     no machine-readable file list or checksums (mcls.acquire refuses)
# checksum: "<algorithm>:<hex>", algorithm md5 or sha256, as the host publishes it.
# role (per file, optional): data (default; a recording), metadata (labels, tables, calibration),
#       doc (readers, scripts, figures, instructions). make_file_list.py skips doc.

[hosts.zenodo]
max_connections = 8
supports_range = true
note = "About 0.6 MB/s per connection (PLAN.md 3.7); see DATA_ACQUISITION.md for 2026-11-12 numbers."

[hosts.nist]
max_connections = 8
supports_range = true
note = "data.nist.gov redirects to nist-oar-cache.s3.amazonaws.com, which answers ranges with 206 (checked 2026-11-12)."

[hosts.mendeley]
max_connections = 8
supports_range = true
note = "public-files download_url redirects to an S3 bucket, which answers ranges with 206 (checked 2026-11-12)."

[hosts.fairdata]
max_connections = 1
supports_range = false
note = "download.fairdata.fi ignores Range (200, whole file) and each token works once (second GET 401): checked 2026-11-12 and in CSCfi/fairdata-download download_api.py."

[hosts.ieee_dataport]
max_connections = 1
supports_range = false
note = "Pages show 'LOGIN TO ACCESS DATASET FILES' (checked 2026-11-12); not fetched by mcls.acquire."

[hosts.panoradio]
max_connections = 1
supports_range = false
note = "Not checked."

[hosts.github]
max_connections = 1
supports_range = false
note = "Not checked; clone with git."

